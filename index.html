<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Only "US" 💞</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: linear-gradient(
                135deg,
                #ffe6f0,
                #fff0f5,
                #ffdce9,
                #fff5f8
            );
            color: #5a3040;
            overflow-x: hidden;
        }

        /* ☀️ Soft sunshine */
        body::before {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            background: #fff3a6;
            border-radius: 50%;
            top: -120px;
            right: -100px;
            opacity: 0.45;
            filter: blur(20px);
            animation: sunshine 6s ease-in-out infinite;
            z-index: -1;
        }

        /* 💕 Floating happy things */
        .floating {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating span {
            position: absolute;
            bottom: -40px;
            font-size: 20px;
            animation: floatUp linear infinite;
            opacity: 0.7;
        }

        .floating span:nth-child(1) {
            left: 10%;
            animation-duration: 8s;
        }

        .floating span:nth-child(2) {
            left: 25%;
            animation-duration: 11s;
            animation-delay: 2s;
        }

        .floating span:nth-child(3) {
            left: 45%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        .floating span:nth-child(4) {
            left: 65%;
            animation-duration: 12s;
            animation-delay: 3s;
        }

        .floating span:nth-child(5) {
            left: 82%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        @keyframes sunshine {

            0%, 100% {
                transform: scale(0.9);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.55;
            }

        }

        @keyframes floatUp {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }

        }

        /* Main content */

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 1000px;
            margin: auto;
        }

        section {
            padding: 80px 20px;
            text-align: center;
        }

        h1 {
            font-size: 50px;
            color: #c94f7c;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 32px;
            color: #c94f7c;
            margin-bottom: 25px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        /* 💗 Soft cards */

        .card {
            background: rgba(255, 255, 255, 0.72);
            border-radius: 25px;
            padding: 35px;
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(190, 70, 110, 0.12);
            backdrop-filter: blur(8px);
        }

    </style>

</head>

<body>

    <!-- 💕 Floating hearts and sparkles -->

    <div class="floating">

        <span>💕</span>
        <span>✨</span>
        <span>🌸</span>
        <span>💗</span>
        <span>☀️</span>

    </div>

    <div class="container">
